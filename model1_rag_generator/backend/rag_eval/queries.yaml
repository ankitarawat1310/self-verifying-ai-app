# relevant: chunk ids a good retriever should return for the query (graded equally).
# Only DEV task prompts appear here; test-task prompts are excluded so retrieval is never tuned on the test set.
queries:
- {id: q01, source: dev_task, category: workflow_state, relevant: [id-separation-of-duties, wf-terminal, wf-role-per-transition, id-header-identity, mt-positive], query: "Create a bounded expense-request API. Employees submit requests with a positive amount and a nonblank description, and managers approve or reject submitted requests. Employees cannot decide requests, requesters cannot approve or reject their own requests, and terminal decisions cannot be changed."}
- {id: q02, source: dev_task, category: data_rules, relevant: [crud-unique-ci, crud-unique-on-update, pd-email, pd-not-blank], query: "Create a bounded contact-directory API. Users can create, list, read, update, and delete contacts. Every contact requires a display name and an email address. Email addresses must be unique without regard to letter case."}
