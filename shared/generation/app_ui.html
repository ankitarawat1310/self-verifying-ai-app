<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App</title>
<style>
:root{--ink:#14213d;--ink2:#4a5568;--muted:#6b7280;--line:#e2e6ec;--bg:#f6f7f9;--card:#fff;--accent:#1c5fd1;--ok:#0f7b3f;--okbg:#e7f6ee;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);padding:20px 24px}
header .wrap,main{max-width:1180px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0;max-width:820px}
.meta{margin-top:8px;font-size:13px;color:var(--muted)}
.meta a{color:var(--accent)}
.idbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:16px;padding:12px 14px;background:#eef3fb;border:1px solid #d5e2f5;border-radius:10px}
.idbar strong{font-size:14px;margin-right:4px;align-self:center}
main{padding:20px 24px 48px}
.res{margin-bottom:28px}
.res h2{font-size:19px;margin:0 0 10px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15px;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:4px 6px;border-radius:5px;color:#fff}
.m.GET{background:#2a78d6}.m.POST{background:#0f7b3f}.m.PATCH,.m.PUT{background:#a0620b}.m.DELETE{background:#b42318}
.path{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all}
.roles{font-size:12px;color:var(--ink2)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #cfd6df;border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:70px}
input[type=checkbox]{width:auto}
.idbar label{min-width:180px}
button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer;align-self:flex-start}
button.secondary{background:#e8edf5;color:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
.out{display:none;border-radius:8px;padding:10px;font-size:13px;overflow:auto;max-height:320px}
.out.ok{display:block;background:var(--okbg);border:1px solid #bfe5cf}
.out.bad{display:block;background:var(--badbg);border:1px solid #f5c2bc}
.out.warn{display:block;background:var(--warnbg);border:1px solid #f0d58a}
.status{font-weight:700;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1f4f8;font-weight:600}
.records{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;overflow:auto}
.records .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.records .top span{font-weight:600}
.empty{color:var(--muted);font-size:13px}
.err li{margin:2px 0}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="wrap">
<h1 id="title">Loading…</h1>
<p class="sub" id="desc"></p>
<div class="meta">Generated by SVAGA 3.0 · <a href="/docs">API docs</a></div>
<div class="idbar" id="idbar" hidden><strong>Acting as</strong></div>
</div></header>
<main id="main"></main>
<footer>Changes are kept in this app's memory while it runs.</footer>
<script>
const CONFIG = /*__SVAGA_CONFIG__*/null;
const cfg = CONFIG || {};
const HIDE = new Set(["/", "/ui", "/health", "/docs", "/redoc", "/openapi.json", "/docs/oauth2-redirect"]);
const STATUS = {200:"OK",201:"Created",202:"Accepted",204:"Done (no content)",400:"Bad request",401:"Not signed in",403:"Not allowed",404:"Not found",405:"Method not allowed",409:"Conflict: not allowed in the current state, or a duplicate",422:"Invalid input",429:"Too many attempts",500:"Server error",502:"The outside service failed"};
const ids = {}; // resource -> Set of known ids
const refreshers = {}; // resource -> function
let spec = null;

const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else if (v !== undefined && v !== null) e.setAttribute(k, v); } for (const c of kids) if (c) e.append(c); return e; };
const shapeKey = (m, p) => m.toUpperCase() + " " + p.replace(/\{[^}]+\}/g, "{}");
const resourceOf = (p) => (p.split("/").filter(Boolean)[0] || "app");
const titleCase = (s) => s.replace(/[-_]/g, " ");
function deref(s) { let n = 0; while (s && s.$ref && n++ < 10) s = spec.components.schemas[s.$ref.split("/").pop()]; return s || {}; }
function unwrap(s) { s = deref(s); const alts = s.anyOf || s.oneOf; if (alts) { const nn = alts.map(deref).filter(a => a.type !== "null"); if (nn.length) return Object.assign({}, s, nn[0]); } return s; }
function example(s, depth = 0) { s = unwrap(s); if (depth > 3) return null; if (s.type === "object" || s.properties) { const o = {}; for (const [k, v] of Object.entries(s.properties || {})) o[k] = example(v, depth + 1); return o; } if (s.type === "array") return [example(s.items || {}, depth + 1)]; if (s.enum) return s.enum[0]; if (s.type === "integer") return 1; if (s.type === "number") return 1.0; if (s.type === "boolean") return true; return ""; }

function identityHeaders() { const h = {}; document.querySelectorAll("[data-header]").forEach(i => { if (i.value.trim()) h[i.dataset.header] = i.value.trim(); }); return h; }

function inputFor(name, schema, required, where) {
  const s = unwrap(schema); let inp;
  if (s.enum) { inp = el("select"); if (!required) inp.append(el("option", { value: "", text: "(leave out)" })); for (const v of s.enum) inp.append(el("option", { value: v, text: v })); }
  else if (s.type === "boolean") inp = el("select", {}, el("option", { value: "", text: required ? "choose" : "(leave out)" }), el("option", { value: "true", text: "true" }), el("option", { value: "false", text: "false" }));
  else if (s.type === "integer" || s.type === "number") inp = el("input", { type: "number", step: s.type === "integer" ? "1" : "any" });
  else if (s.type === "array" || s.type === "object" || s.properties) { inp = el("textarea", { placeholder: "JSON" }); inp.value = JSON.stringify(example(s), null, 1); inp.dataset.json = "1"; }
  else if (s.format === "date") inp = el("input", { type: "date" });
  else if (s.format === "date-time") inp = el("input", { type: "datetime-local" });
  else if (s.format === "email") inp = el("input", { type: "email", placeholder: "name@example.com" });
  else inp = el("input", { type: "text" });
  inp.dataset.name = name; inp.dataset.where = where; inp.dataset.kind = s.type || ""; inp.dataset.format = s.format || "";
  const lab = el("label", {}, document.createTextNode(titleCase(name) + " "), required ? null : el("span", { class: "opt", text: "(optional)" }));
  if (s.description) inp.title = s.description;
  lab.append(inp); return { lab, inp };
}

function readValue(inp) {
  let v = inp.value;
  if (v === "" || v === undefined) return undefined;
  if (inp.dataset.json) { try { return JSON.parse(v); } catch { throw new Error(titleCase(inp.dataset.name) + " is not valid JSON"); } }
  if (inp.dataset.kind === "integer") return parseInt(v, 10);
  if (inp.dataset.kind === "number") return parseFloat(v);
  if (inp.dataset.kind === "boolean") return v === "true";
  if (inp.dataset.format === "date-time" && v.length === 16) return v + ":00";
  return v;
}

function renderValue(data) {
  if (Array.isArray(data)) {
    if (!data.length) return el("div", { class: "empty", text: "No records yet." });
    if (data.every(x => x && typeof x === "object" && !Array.isArray(x))) {
      const cols = [...new Set(data.flatMap(Object.keys))];
      const t = el("table"); t.append(el("tr", {}, ...cols.map(c => el("th", { text: titleCase(c) }))));
      for (const row of data) t.append(el("tr", {}, ...cols.map(c => el("td", { text: fmt(row[c]) }))));
      return t;
    }
  }
  if (data && typeof data === "object") { const t = el("table"); for (const [k, v] of Object.entries(data)) t.append(el("tr", {}, el("th", { text: titleCase(k) }), el("td", { text: fmt(v) }))); return t; }
  return el("pre", { text: fmt(data) });
}
const fmt = (v) => v === null || v === undefined ? "—" : typeof v === "object" ? JSON.stringify(v) : String(v);

function showResponse(out, status, data) {
  out.className = "out " + (status < 300 ? "ok" : status === 409 || status === 404 ? "warn" : "bad");
  out.replaceChildren(el("div", { class: "status", text: status + " " + (STATUS[status] || "") }));
  if (status === 422 && data && Array.isArray(data.detail)) {
    const ul = el("ul", { class: "err" }); for (const d of data.detail) ul.append(el("li", { text: (d.loc || []).filter(x => x !== "body").join(".") + ": " + d.msg })); out.append(ul);
  } else if (data && data.detail && typeof data.detail === "string") out.append(el("div", { text: data.detail }));
  else if (data !== null && data !== undefined && data !== "") out.append(renderValue(data));
}

function remember(resource, data) {
  const add = (x) => { if (x && typeof x === "object" && x.id !== undefined && x.id !== null) (ids[resource] ||= new Set()).add(String(x.id)); };
  if (Array.isArray(data)) data.forEach(add); else add(data);
  document.querySelectorAll(`datalist[data-res="${resource}"]`).forEach(dl => dl.replaceChildren(...[...(ids[resource] || [])].map(i => el("option", { value: i }))));
}

async function call(method, path, body) {
  const headers = identityHeaders(); const init = { method, headers };
  if (body !== undefined) { headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  const r = await fetch(path, init); let data = null; const txt = await r.text(); try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
  return { status: r.status, data };
}

function opCard(path, method, op, resource) {
  const key = shapeKey(method, path);
  const info = (cfg.endpoints || []).find(e => shapeKey(e.method, e.path) === key) || {};
  const card = el("div", { class: "card" });
  card.append(el("h3", {}, el("span", { class: "m " + method.toUpperCase(), text: method.toUpperCase() }), document.createTextNode(info.summary || op.summary || titleCase(path))));
  card.append(el("div", { class: "path", text: path }));
  if (info.roles && info.roles.length) card.append(el("div", { class: "roles", text: "Who can do this: " + info.roles.join(", ") }));
  const inputs = [];
  for (const p of op.parameters || []) {
    if (p.in === "header") continue;
    const { lab, inp } = inputFor(p.name, p.schema || {}, !!p.required, p.in); inputs.push(inp); card.append(lab);
    if (p.in === "path") { const dl = el("datalist", { id: "dl-" + Math.random().toString(36).slice(2), "data-res": resource }); inp.setAttribute("list", dl.id); inp.placeholder = "pick or type an id"; card.append(dl); }
  }
  const rb = op.requestBody && op.requestBody.content && op.requestBody.content["application/json"];
  if (rb) {
    const s = unwrap(rb.schema || {}); const req = new Set(s.required || []);
    for (const [name, ps] of Object.entries(s.properties || {})) { const { lab, inp } = inputFor(name, ps, req.has(name), "body"); inputs.push(inp); card.append(lab); }
  }
  const btn = el("button", { text: method.toUpperCase() === "GET" ? "Look up" : method.toUpperCase() === "DELETE" ? "Delete" : "Submit" });
  if (method.toUpperCase() === "DELETE") btn.style.background = "#b42318";
  const out = el("div", { class: "out", role: "status" });
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      let url = path; const q = new URLSearchParams(); let body;
      for (const inp of inputs) {
        const v = readValue(inp);
        if (inp.dataset.where === "path") url = url.replace("{" + inp.dataset.name + "}", encodeURIComponent(v ?? ""));
        else if (inp.dataset.where === "query") { if (v !== undefined) q.set(inp.dataset.name, v); }
        else if (inp.dataset.where === "body") { body = body || {}; if (v !== undefined) body[inp.dataset.name] = v; }
      }
      if (rb && body === undefined) body = {};
      const qs = q.toString(); const res = await call(method.toUpperCase(), url + (qs ? "?" + qs : ""), body);
      showResponse(out, res.status, res.data);
      if (res.status < 300) { remember(resource, res.data); Object.values(refreshers).forEach(f => f()); }
    } catch (e) { out.className = "out bad"; out.replaceChildren(el("div", { class: "status", text: e.message })); }
    finally { btn.disabled = false; }
  };
  card.append(btn, out);
  return card;
}

function recordsPanel(resource, listPath, readPath) {
  const box = el("div", { class: "records" }); const body = el("div");
  const refresh = el("button", { class: "secondary", text: "Refresh" });
  box.append(el("div", { class: "top" }, el("span", { text: listPath ? "All " + titleCase(resource) : "Recent " + titleCase(resource) }), refresh), body);
  const load = async () => {
    try {
      if (listPath) { const r = await call("GET", listPath); if (r.status < 300) { remember(resource, r.data); body.replaceChildren(renderValue(r.data)); } else body.replaceChildren(el("div", { class: "empty", text: r.status + " " + (STATUS[r.status] || "") + (r.status === 403 ? ": choose who you are acting as above" : "") })); return; }
      const known = [...(ids[resource] || [])];
      if (!known.length) { body.replaceChildren(el("div", { class: "empty", text: "Records you create here will appear in this list." })); return; }
      const rows = []; for (const i of known.slice(-20)) { const r = await call("GET", readPath.replace(/\{[^}]+\}/, encodeURIComponent(i))); if (r.status < 300 && r.data && typeof r.data === "object") rows.push(r.data); }
      body.replaceChildren(rows.length ? renderValue(rows) : el("div", { class: "empty", text: "Not visible to the current user." }));
    } catch (e) { body.replaceChildren(el("div", { class: "empty", text: e.message })); }
  };
  refresh.onclick = load; refreshers[resource] = load; load();
  return box;
}

async function start() {
  const r = await fetch("/openapi.json"); spec = await r.json();
  document.title = cfg.title || spec.info.title || "App";
  document.getElementById("title").textContent = cfg.title || spec.info.title || "App";
  document.getElementById("desc").textContent = cfg.description || "";
  const groups = {}; const headerParams = new Map();
  for (const [path, ops] of Object.entries(spec.paths || {})) {
    if (HIDE.has(path)) continue;
    for (const [method, op] of Object.entries(ops)) {
      if (!["get", "post", "put", "patch", "delete"].includes(method)) continue;
      (groups[resourceOf(path)] ||= []).push({ path, method, op });
      for (const p of op.parameters || []) if (p.in === "header") headerParams.set(p.name, p);
    }
  }
  if (headerParams.size) {
    const bar = document.getElementById("idbar"); bar.hidden = false;
    for (const [name] of headerParams) {
      const isRole = /role/i.test(name); let inp;
      if (isRole && (cfg.roles || []).length) { inp = el("select"); for (const ro of cfg.roles) inp.append(el("option", { value: ro, text: ro })); }
      else { inp = el("input", { type: "text", value: isRole ? "" : "alice" }); }
      inp.dataset.header = name;
      const lab = el("label", {}, document.createTextNode(isRole ? "Role (" + name + ")" : "User id (" + name + ")")); lab.append(inp); bar.append(lab);
      inp.addEventListener("change", () => Object.values(refreshers).forEach(f => f()));
    }
  }
  const main = document.getElementById("main");
  for (const [res, ops] of Object.entries(groups)) {
    const sec = el("section", { class: "res" }); sec.append(el("h2", { text: titleCase(res) }));
    const list = ops.find(o => o.method === "get" && !o.path.includes("{") && !(o.op.parameters || []).some(p => p.required && p.in === "query"));
    const read = ops.find(o => o.method === "get" && /\{[^}]+\}$/.test(o.path));
    if (list || read) sec.append(recordsPanel(res, list && list.path, read && read.path));
    const grid = el("div", { class: "grid" });
    const order = { post: 0, get: 1, patch: 2, put: 2, delete: 3 };
    ops.sort((a, b) => (order[a.method] - order[b.method]) || a.path.length - b.path.length).forEach(o => grid.append(opCard(o.path, o.method, o.op, res)));
    sec.append(grid); main.append(sec);
  }
}
start().catch(e => { document.getElementById("title").textContent = "Could not load the app"; document.getElementById("desc").textContent = e.message; });
</script>
</body>
</html>
