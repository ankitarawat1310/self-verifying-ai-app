task_id: connector_address_validation
security_mutants:
- id: sec_method_override
  description: A caller-supplied HTTP method is used for the connector call
  edits:
  - find: '    address: str = Field(min_length=1)

      '
    replace: "    address: str = Field(min_length=1)\n    method: str = \"POST\"\n"
    occurrence: 1
  - find: 'reply = httpx.post(CONNECTOR_URL, json={"address": payload.address}, timeout=5.0)'
    replace: 'reply = httpx.request(payload.method, CONNECTOR_URL, json={"address": payload.address}, timeout=5.0)'
    occurrence: 1
  expected_failing_checks:
  - test_endpoint_or_method_override_is_rejected
- id: sec_unvalidated_flag
  description: The valid flag is stored without checking it is a boolean
  edits:
  - find: '    if not isinstance(valid, bool) or not isinstance(normalized, str) or not normalized.strip():'
    replace: '    if not isinstance(normalized, str) or not normalized.strip():'
    occurrence: 1
  expected_failing_checks:
  - test_non_boolean_valid_flag_is_502
- id: sec_fail_open
  description: Connector failure stores the address as invalid instead of returning 502
  edits:
  - find: '        raise HTTPException(502, "address connector failed") from error'
    replace: '        normalized, valid = payload.address, False'
    occurrence: 1
  expected_failing_checks:
  - test_connector_error_is_502
