task_id: approval_purchase_request
security_mutants:
- id: sec_reject_skips_limit
  description: Managers can reject high-value requests (limit applied only to approve)
  edits:
  - find: '    return _decide_with_limit(request_id, actor, role, "rejected")'
    replace: '    return _decide(request_id, actor, "rejected")'
    occurrence: 1
  expected_failing_checks:
  - test_manager_cannot_decide_above_5000
- id: sec_status_injection
  description: Unknown submit fields such as status are silently accepted
  edits:
  - find: '    model_config = ConfigDict(extra="forbid")'
    replace: '    model_config = ConfigDict(extra="ignore")'
    occurrence: 1
  expected_failing_checks:
  - test_status_injection_is_422
- id: sec_wrong_limit
  description: Manager limit doubled to 10000
  edits:
  - find: 'record["amount"] > MANAGER_LIMIT:'
    replace: 'record["amount"] > MANAGER_LIMIT * 2:'
    occurrence: 1
  expected_failing_checks:
  - test_manager_cannot_decide_above_5000
