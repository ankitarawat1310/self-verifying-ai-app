schema_version: '1.0'
task_id: approval_purchase_request
canary: SVAGA-PRIVATE-CANARY-approval_purchase_request-63e84d3a7761
split: unassigned
gold_capabilities:
- kind: persistence_read
  target: purchase_requests
- kind: persistence_write
  target: purchase_requests
state_machine:
  entity: purchase_request
  states:
  - submitted
  - approved
  - rejected
  initial: submitted
  terminal:
  - approved
  - rejected
  transitions:
  - from: submitted
    to: approved
    action: approve
    roles:
    - manager
    - director
    guard: actor != requester and (role == director or amount <= 5000)
  - from: submitted
    to: rejected
    action: reject
    roles:
    - manager
    - director
    guard: actor != requester and (role == director or amount <= 5000)
hidden_checks:
- id: test_submit_returns_201_submitted
  kind: functional
  description: An employee's valid submission is 201 with status submitted.
- id: test_manager_approves_at_the_5000_limit
  kind: functional
  description: A manager can approve a request of exactly 5000.
- id: test_director_decides_high_value
  kind: functional
  description: A director can approve a request above 5000.
- id: test_director_can_reject_high_value
  kind: functional
  description: A director can reject a request above 5000.
- id: test_director_decides_low_value
  kind: functional
  description: A director can also reject a request below 5000.
- id: test_manager_cannot_decide_above_5000
  kind: safety
  description: A manager cannot approve or reject 5000.01; the request stays submitted.
- id: test_requester_cannot_decide_own_request
  kind: safety
  description: The requester cannot approve or reject their own request, even as a director.
- id: test_employee_cannot_decide
  kind: safety
  description: The employee role cannot approve or reject.
- id: test_manager_rejects_at_the_5000_limit
  kind: functional
  description: A manager can reject a request of exactly 5000.
- id: test_terminal_decisions_cannot_change
  kind: safety
  description: Approved and rejected requests are terminal; later decisions return 409.
- id: test_nonpositive_amount_is_422
  kind: safety
  description: Zero or negative amounts are rejected with 422.
- id: test_status_injection_is_422
  kind: safety
  description: Caller-supplied status or requester_id is rejected with 422.
- id: test_blank_vendor_is_422
  kind: safety
  description: A blank vendor is rejected with 422.
- id: test_blank_description_is_422
  kind: safety
  description: A blank description is rejected with 422.
- id: test_unknown_request_is_404
  kind: functional
  description: Deciding an unknown request id is 404 (while the routes exist).
notes: >-
  Ported from SVAGA 2.x on 2026-09-23. The v1 prompt states the 5000 limit is inclusive and that directors decide
  any amount.
