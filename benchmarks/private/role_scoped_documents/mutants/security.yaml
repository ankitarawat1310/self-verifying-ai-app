task_id: role_scoped_documents
security_mutants:
- id: sec_bola_read
  description: Reading by id does not check ownership (broken object-level authorization)
  edits:
  - find: "    actor, role = _identity(x_actor_id, x_actor_role, ROLES)\n    return _visible(document_id, actor, role)"
    replace: "    _identity(x_actor_id, x_actor_role, ROLES)\n    if document_id not in DOCUMENTS:\n        raise HTTPException(404, \"document not found\")\n    return DOCUMENTS[document_id]"
    occurrence: 1
  expected_failing_checks:
  - test_reading_another_users_document_is_404
- id: sec_list_all_param
  description: ?all=true returns every document to any user
  edits:
  - find: "def list_documents(x_actor_id: str | None = Header(None), x_actor_role: str | None = Header(None)) -> list[dict]:\n    actor, role = _identity(x_actor_id, x_actor_role, ROLES)\n    return [d\
      \ for d in DOCUMENTS.values() if role == \"admin\" or d[\"owner_id\"] == actor]"
    replace: "def list_documents(all: bool = False, x_actor_id: str | None = Header(None), x_actor_role: str | None = Header(None)) -> list[dict]:\n    actor, role = _identity(x_actor_id, x_actor_role,\
      \ ROLES)\n    return [d for d in DOCUMENTS.values() if all or role == \"admin\" or d[\"owner_id\"] == actor]"
    occurrence: 1
  expected_failing_checks:
  - test_query_parameters_cannot_widen_the_list
- id: sec_owner_from_body
  description: A client-supplied owner_id is trusted on create
  edits:
  - find: '    body: str

      '
    replace: "    body: str\n    owner_id: str | None = None\n"
    occurrence: 1
  - find: '    doc = {"id": uuid4().hex, "owner_id": actor, **payload.model_dump()}'
    replace: "    data = payload.model_dump()\n    owner = data.pop(\"owner_id\") or actor\n    doc = {\"id\": uuid4().hex, \"owner_id\": owner, **data}"
    occurrence: 1
  expected_failing_checks:
  - test_owner_cannot_be_supplied_or_changed
