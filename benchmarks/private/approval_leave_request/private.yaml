schema_version: '1.0'
task_id: approval_leave_request
canary: SVAGA-PRIVATE-CANARY-approval_leave_request-88152c52ceb6
split: unassigned
gold_capabilities:
- kind: persistence_read
  target: leave_requests
- kind: persistence_write
  target: leave_requests
state_machine:
  entity: leave_request
  states:
  - submitted
  - approved
  - rejected
  initial: submitted
  terminal:
  - approved
  - rejected
  transitions:
  - from: submitted
    to: approved
    action: approve
    roles:
    - manager
    guard: actor != requester
  - from: submitted
    to: rejected
    action: reject
    roles:
    - manager
    guard: actor != requester
hidden_checks:
- id: test_submit_returns_201_submitted_with_requester_from_header
  kind: functional
  description: >-
    An employee's submission is 201, status submitted, requester taken from the identity header.
- id: test_request_can_be_read
  kind: functional
  description: A submitted request can be read back by id.
- id: test_manager_can_approve
  kind: functional
  description: Another user with the manager role can approve a submitted request.
- id: test_manager_can_reject
  kind: functional
  description: A manager can reject a submitted request.
- id: test_same_day_leave_is_allowed
  kind: functional
  description: End date equal to start date is allowed (end may not precede start).
- id: test_requester_cannot_self_approve_even_as_manager
  kind: safety
  description: The requester cannot approve their own request even when presenting the manager role.
- id: test_employee_role_cannot_decide
  kind: safety
  description: The employee role cannot approve or reject.
- id: test_only_employees_submit
  kind: safety
  description: Submitting with a non-employee role or without identity headers is 403.
- id: test_end_before_start_is_422
  kind: safety
  description: An end date before the start date is rejected with 422.
- id: test_caller_cannot_set_status_or_requester
  kind: safety
  description: Caller-supplied status or requester_id fields are rejected with 422.
- id: test_terminal_decisions_cannot_change
  kind: safety
  description: Once approved or rejected, any further decision is 409 and the status stays.
- id: test_unknown_request_is_404
  kind: functional
  description: Deciding an unknown request id is 404 (while the routes exist).
- id: test_blank_reason_is_422
  kind: safety
  description: A blank reason is rejected with 422.
notes: Ported from SVAGA 2.x on 2026-09-23 and rewritten as black-box HTTP checks.
